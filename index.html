<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>India Drone Academy Assistant</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
    }

    /* optional page content styles */
    .content {
      padding: 2rem;
      max-width: 800px;
    }

    /* --- Chatbot custom styles --- */
    .chatbot-window {
      position: fixed !important;
      top: 10% !important;
      right: 20px !important;
      width: 400px !important;           /* fixed width */
      height: 80vh !important;           /* 80% of viewport height */
      max-height: 80vh !important;
      border-radius: 12px !important;
      box-shadow: 0 0 20px rgba(0,0,0,0.2);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      background-color: #fafafa;
    }

    /* the inner scrollable area */
    .chatbot-window .chatbot-body {
      overflow-y: auto !important;
      flex: 1;
    }

    .chatbot-message {
      border-radius: 12px;
    }

    .chatbot-button {
      display: none !important; /* hide default floating button */
    }
  </style>
</head>
<body>
  <div class="content">
    <h1>Welcome to India Drone Academy</h1>
    <p>This is your site content…</p>
  </div>

  <!-- Load Flowise Embed -->
  <script type="module">
    import Chatbot from "https://cdn.jsdelivr.net/npm/flowise-embed/dist/web.js"

    Chatbot.init({
      chatflowid: "59b6625a-7edb-4bb6-b87c-7b8724bf65b4", // replace with your flow ID
      apiHost: "https://srv1006227.hstgr.cloud",          // replace with your host
      chatflowConfig: {
        /* Chatflow Config (if any) */
      },
      theme: {
        button: {
          backgroundColor: "#004aad",
          right: 20,
          bottom: 20,
          size: "medium",
          iconColor: "#ffffff"
        },
        chatWindow: {
          showTitle: true,
          showAgentMessages: true,
          title: "India Drone Academy Assistant",
          backgroundColor: "#fafafa",
          height: "80vh",
          width: "400px",
          fontSize: 16,
          // you can tweak inputBox & footer here as well
        },
        // override styles with custom CSS
        customCSS: `
          .chatbot-window {
            position: fixed !important;
            top: 10% !important;
            right: 20px !important;
            width: 400px !important;
            height: 80vh !important;
            max-height: 80vh !important;
            border-radius: 12px !important;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            background-color: #fafafa;
          }
          .chatbot-window .chatbot-body {
            overflow-y: auto !important;
            flex: 1;
          }
          .chatbot-message {
            border-radius: 12px;
          }
          .chatbot-button {
            display: none !important;
          }
        `
      }
    })
  </script>
</body>
</html>
