<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/index.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>India Drone Academy - Professional Drone Training</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- ✅ Flowise Chatbot -->
  <script type="module">
    import Chatbot from "https://cdn.jsdelivr.net/npm/flowise-embed/dist/web.js"

    Chatbot.init({
      chatflowid: "59b6625a-7edb-4bb6-b87c-7b8724bf65b4",
      apiHost: "https://srv1006227.hstgr.cloud",
      chatflowConfig: {},
      observersConfig: {},
      theme: {
        button: {
          backgroundColor: '#E84C21',
          right: 20,
          bottom: 20,
          size: 56,
          dragAndDrop: true,
          iconColor: '#ffffff',
          customIconSrc: '/logoCube.png',
          autoWindowOpen: {
            autoOpen: true,
            openDelay: 2,
            autoOpenOnMobile: false
          }
        },
        tooltip: {
          showTooltip: true,
          tooltipMessage: '👋 Hi, ask me about Drone Training!',
          tooltipBackgroundColor: '#E84C21',
          tooltipTextColor: '#ffffff',
          tooltipFontSize: 15
        },
        disclaimer: {
          title: 'Disclaimer',
          message: "By using this chatbot, you agree to the <a target=\"_blank\" href=\"https://indiadroneacademy.com/terms\">Terms & Conditions</a>",
          textColor: '#333333',
          buttonColor: '#E84C21',
          buttonText: 'Start Chatting',
          buttonTextColor: '#ffffff',
          blurredBackgroundColor: 'rgba(0, 0, 0, 0.5)',
          backgroundColor: 'white'
        },

        customCSS: `
          .chatbot-window {
            position: fixed !important;
            top: 0 !important;
            right: 0 !important;
            width: 420px !important;
            max-width: 50% !important;
            height: 100vh !important;
            display: flex !important;
            flex-direction: column !important;
            border-radius: 0 !important;
            box-shadow: 0 0 20px rgba(0,0,0,0.2) !important;
            overflow: hidden !important;
            font-family: 'Helvetica Neue', sans-serif;
            z-index: 99999 !important;
          }

          .chatbot-window .chatbot-header,
          .chatbot-window .chatbot-top,
          .chatbot-window .chatbot-title {
            flex: 0 0 auto !important;
          }

          .chatbot-window .chatbot-body,
          .chatbot-window .chatbot-content,
          .chatbot-window .chatbot-messages,
          .chatbot-window .flowise-messages {
            flex: 1 1 auto !important;
            min-height: 0 !important;
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch !important;
            padding: 12px !important;
          }

          .chatbot-window .chatbot-message,
          .chatbot-window .chatbot-message * {
            white-space: normal !important;
            word-break: break-word !important;
            overflow-wrap: anywhere !important;
          }

          .chatbot-window .chatbot-footer,
          .chatbot-window .chatbot-input {
            flex: 0 0 auto !important;
          }

          .chatbot-button {
            display: block !important;
          }

          .chatbot-window .chatbot-controls,
          .chatbot-window .chatbot-controls button {
            display: inline-flex !important;
          }

          @media (max-width: 768px) {
            .chatbot-window {
              width: 100% !important;
              left: 0 !important;
              right: 0 !important;
              height: 60vh !important;
              top: auto !important;
              bottom: 0 !important;
              border-radius: 12px 12px 0 0 !important;
            }
          }
        `,

        chatWindow: {
          showTitle: true,
          showAgentMessages: true,
          title: 'India Drone Academy Assistant',
          titleAvatarSrc: './logoCube.png',
          welcomeMessage: '🚁 Welcome to India Drone Academy! How can I assist you today?',
          errorMessage: '⚠️ Sorry, something went wrong. Please try again.',
          backgroundColor: '#fafafa',
          height: '100%',
          width: '420px',
          fontSize: 16,
          starterPrompts: [
            "What drone courses are available?",
            "Are you DGCA-approved?",
            "What is the course fee?",
            "Do you provide certification?"
          ],
          starterPromptFontSize: 15,
          clearChatOnReload: false,
          sourceDocsTitle: '📂 Sources:',
          renderHTML: true,
          botMessage: {
            backgroundColor: '#FFF3EF',
            textColor: '#333333',
            showAvatar: true,
            avatarSrc: './logoCube.png'
          },
          userMessage: {
            backgroundColor: '#E84C21',
            textColor: '#ffffff',
            showAvatar: true,
            avatarSrc: 'https://img.icons8.com/color/48/student-male--v1.png'
          },
          textInput: {
            placeholder: 'Type your question about our academy...',
            backgroundColor: '#ffffff',
            textColor: '#333333',
            sendButtonColor: '#E84C21',
            maxChars: 200,
            maxCharsWarningMessage: '⚠️ Please keep your message under 200 characters.',
            autoFocus: true,
            sendMessageSound: true,
            sendSoundLocation: 'send_message.mp3',
            receiveMessageSound: true,
            receiveSoundLocation: 'receive_message.mp3'
          },
          feedback: {
            color: '#E84C21'
          },
          dateTimeToggle: {
            date: true,
            time: true
          },
          footer: {
            textColor: '#555555',
            text: 'Powered by',
            company: 'India Drone Academy',
            companyLink: 'https://indiadroneacademy.com'
          }
        }
      }
    })
  </script>
</body>
</html>
